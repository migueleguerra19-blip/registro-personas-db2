name: Publicar en GitHub Pages

on:
  push:
    branches: [main, "feature/registro-personas-db2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio y configuración pública
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp manifest.webmanifest sw.js config.js _site/
          mkdir _site/icons
          cp icons/icon.svg _site/icons/
          touch _site/.nojekyll
      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
